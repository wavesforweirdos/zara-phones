name: CI

on:
  # Every branch, so feature/fix branches are checked before being merged into develop
  push:
  pull_request:
    branches: [master, develop]

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fake API config: the build only needs the variables to exist, and the e2e tests
# intercept every request (see e2e/fixtures/api.js). The real key never reaches CI.
env:
  API_BASE_URL: https://api.ci.test
  API_KEY: ci-api-key

jobs:
  quality:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
